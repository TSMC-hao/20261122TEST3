<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚禮相片輪播</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #video-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #yt-audio {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }
    #overlay h1 {
      font-size: 26px;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    #overlay .btn {
      font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 10px 24px;
      border-radius: 30px;
    }
    #status-msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffb4b4;
      font-size: 14px;
      z-index: 101;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="overlay" onclick="startPlayback()">
    <h1>點擊螢幕開始輪播</h1>
    <div class="btn">🎵 配樂：Henry Moodie - you were there for me</div>
  </div>

  <div id="status-msg"></div>

  <div id="video-wrapper">
    <!-- 建議將影片檔案重新命名為全英文小寫 wedding.mp4 並放置於同層目錄 -->
    <video id="bg-video" autoplay loop muted playsinline preload="auto">
      <source src="wedding.mp4" type="video/mp4">
    </video>
  </div>

  <div id="yt-audio"></div>

  <script>
    // YouTube API
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-audio', {
        height: '100',
        width: '100',
        videoId: '65ZRPTcxkWk',
        playerVars: {
          'autoplay': 0,
          'loop': 1,
          'playlist': '65ZRPTcxkWk',
          'controls': 0
        }
      });
    }

    var video = document.getElementById('bg-video');
    var statusMsg = document.getElementById('status-msg');

    // 監聽影片錯誤事件，若路徑或載入失敗直接提示
    video.addEventListener('error', function(e) {
      statusMsg.innerHTML = '⚠️ 影片檔案載入失敗！請確認影片已更名為 <b>wedding.mp4</b> 且已成功推送到 GitHub (單檔需小於 100MB)。';
    }, true);

    function startPlayback() {
      var overlay = document.getElementById('overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 500);

      video.play().catch(function(err) {
        console.log("影片播放等待中:", err);
      });

      if (player && player.playVideo) {
        player.playVideo();
      }
    }
  </script>
</body>
</html>
